# golangci-lint v2 (version pinned in mise.toml). `make lint` runs it; `make fmt` applies the formatters.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - sloglint
    - unconvert
    - usestdlibvars
  settings:
    sloglint:
      attr-only: true # typed attributes (slog.String(...)), never loose key-value pairs
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests build fake credentials, listen on loopback and control request lifetimes themselves.
      - path: _test\.go$
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/juanmonsalveg/homelab-go
